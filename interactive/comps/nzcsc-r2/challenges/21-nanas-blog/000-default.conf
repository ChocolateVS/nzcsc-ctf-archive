<VirtualHost *:5000>
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Behind a TLS-terminating reverse proxy (Caddy): trust the forwarded scheme
	# so WordPress sees HTTPS (is_ssl() true -> no scheme-flip redirect loop) and
	# emits https self-links, exactly like the live original.
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	RewriteEngine On
	# Apache listens on :5000 (unprivileged user). mod_dir's own "add trailing
	# slash" redirect (e.g. /wp-admin -> /wp-admin/) would build its Location
	# from the backend listen port + plaintext scheme (http://host:5000/...),
	# which the browser cannot reach - this is why /wp-admin appeared broken.
	# Pre-empt mod_dir: issue the trailing-slash redirect ourselves, from the
	# client-facing Host and forwarded scheme, before mod_dir runs. The live
	# original listens on :80 so it never leaks a port; this reproduces that.
	# (%{DOCUMENT_ROOT}%{REQUEST_URI} is used for the -d test because
	# %{REQUEST_FILENAME} is still unmapped in virtual-host scope.)
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
	RewriteCond %{REQUEST_URI} !/$
	RewriteCond %{HTTP:X-Forwarded-Proto} =https [OR]
	RewriteCond %{HTTPS} =on
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L]

	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
	RewriteCond %{REQUEST_URI} !/$
	RewriteCond %{HTTP:X-Forwarded-Proto} !=https
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ http://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L]
</VirtualHost>
