<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In &lsaquo; {{ site_title }} &mdash; WordPress</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
    <div id="login">
        <h1 class="login-logo"><a href="https://wordpress.org/">{{ site_title }}</a></h1>
        <form name="loginform" id="loginform" action="{{ site_url }}/wp-login.php" method="post">
            <p><label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" autocomplete="username"></p>
            <p><label for="user_pass">Password</label>
                <input type="password" name="pwd" id="user_pass" autocomplete="current-password"></p>
            <p class="submit"><input type="submit" name="wp-submit" id="wp-submit" value="Log In"></p>
        </form>
        <p id="nav"><a href="{{ site_url }}/wp-login.php?action=lostpassword">Lost your password?</a></p>
        <p id="backtoblog"><a href="{{ site_url }}/">&larr; Go to {{ site_title }}</a></p>
    </div>
</body>
</html>
