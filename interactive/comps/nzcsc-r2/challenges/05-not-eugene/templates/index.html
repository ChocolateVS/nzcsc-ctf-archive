<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>!Eugene Goostman</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1791099492133941382" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-session-id="{{ session_id }}">
    <div class="shell">
      <header class="hero">
        <p class="kicker"></p>
        <h1>Not Eugene Goostman</h1>
        <p class="lede">
          I am not AI. I swear!
        </p>
        <p class="lede">
          Hasta La Vista, Baby ;-)
        </p>
      </header>

      <section class="chat-card" aria-label="Chat with Mykola Melnyk">
        <div class="chat-head">
          <div class="avatar" aria-hidden="true">MM</div>
          <div>
            <h2>Mykola Melnyk</h2>
            <p class="status"><span class="dot"></span> Online · Odessa, Ukraine · 13</p>
          </div>
        </div>
        <div id="log" class="log" role="log" aria-live="polite"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Message to Mykola</label>
          <input
            id="message"
            name="message"
            type="text"
            maxlength="400"
            autocomplete="off"
            placeholder="Type a question and press Enter…"
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>

      <footer>
        <p>
           Be polite. He is, allegedly, thirteen.
        </p>
      </footer>
    </div>
    <script src="/static/js/chat.js?v=1791099492133941382"></script>
  </body>
</html>
